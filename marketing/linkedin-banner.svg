<svg width="1584" height="396" viewBox="0 0 1584 396" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090B"/>
      <stop offset="50%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>

    <!-- Amber accent gradient -->
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Amber glow -->
    <radialGradient id="glow1" cx="30%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow2" cx="75%" cy="40%" r="30%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0"/>
    </radialGradient>

    <!-- Glassmorphic pill filter -->
    <filter id="blur1">
      <feGaussianBlur stdDeviation="2"/>
    </filter>

    <!-- Text shadow -->
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1584" height="396" fill="url(#bg)"/>

  <!-- Ambient glows -->
  <rect width="1584" height="396" fill="url(#glow1)"/>
  <rect width="1584" height="396" fill="url(#glow2)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#F59E0B"/>
    </pattern>
    <rect width="1584" height="396" fill="url(#grid)"/>
  </g>

  <!-- Decorative waveform bars (left side, behind text) -->
  <g transform="translate(100, 80)" opacity="0.15">
    <rect x="0" y="80" width="6" height="60" rx="3" fill="#F59E0B"/>
    <rect x="14" y="50" width="6" height="120" rx="3" fill="#F59E0B"/>
    <rect x="28" y="30" width="6" height="160" rx="3" fill="#F59E0B"/>
    <rect x="42" y="60" width="6" height="100" rx="3" fill="#F59E0B"/>
    <rect x="56" y="40" width="6" height="140" rx="3" fill="#F59E0B"/>
    <rect x="70" y="70" width="6" height="80" rx="3" fill="#F59E0B"/>
    <rect x="84" y="20" width="6" height="180" rx="3" fill="#D97706"/>
    <rect x="98" y="55" width="6" height="110" rx="3" fill="#F59E0B"/>
    <rect x="112" y="75" width="6" height="70" rx="3" fill="#F59E0B"/>
    <rect x="126" y="45" width="6" height="130" rx="3" fill="#D97706"/>
    <rect x="140" y="65" width="6" height="90" rx="3" fill="#F59E0B"/>
    <rect x="154" y="35" width="6" height="150" rx="3" fill="#F59E0B"/>
  </g>

  <!-- Glassmorphic floating pills -->
  <g opacity="0.06">
    <rect x="1200" y="40" width="200" height="60" rx="30" fill="#F59E0B" transform="rotate(-12 1300 70)"/>
    <rect x="1100" y="260" width="160" height="50" rx="25" fill="#D97706" transform="rotate(8 1180 285)"/>
    <rect x="80" y="300" width="140" height="45" rx="22" fill="#F59E0B" transform="rotate(-6 150 322)"/>
  </g>

  <!-- Decorative waveform bars (right side) -->
  <g transform="translate(1300, 100)" opacity="0.12">
    <rect x="0" y="40" width="5" height="100" rx="2.5" fill="#F59E0B"/>
    <rect x="12" y="20" width="5" height="140" rx="2.5" fill="#D97706"/>
    <rect x="24" y="50" width="5" height="80" rx="2.5" fill="#F59E0B"/>
    <rect x="36" y="10" width="5" height="160" rx="2.5" fill="#F59E0B"/>
    <rect x="48" y="35" width="5" height="110" rx="2.5" fill="#D97706"/>
    <rect x="60" y="55" width="5" height="70" rx="2.5" fill="#F59E0B"/>
    <rect x="72" y="25" width="5" height="130" rx="2.5" fill="#F59E0B"/>
    <rect x="84" y="45" width="5" height="90" rx="2.5" fill="#D97706"/>
    <rect x="96" y="15" width="5" height="150" rx="2.5" fill="#F59E0B"/>
    <rect x="108" y="60" width="5" height="60" rx="2.5" fill="#F59E0B"/>
  </g>

  <!-- SoundSauce Logo (wave bars) -->
  <g transform="translate(380, 110)">
    <rect x="0" y="24" width="8" height="32" rx="4" fill="url(#amber)"/>
    <rect x="14" y="14" width="8" height="52" rx="4" fill="url(#amber)"/>
    <rect x="28" y="4" width="8" height="72" rx="4" fill="url(#amber)"/>
    <rect x="42" y="18" width="8" height="44" rx="4" fill="url(#amber)"/>
    <rect x="56" y="8" width="8" height="64" rx="4" fill="url(#amber)"/>
  </g>

  <!-- Main title -->
  <text x="460" y="162" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="56" font-weight="700" fill="#FAFAFA" letter-spacing="-1">
    SoundSauce
  </text>

  <!-- Divider line -->
  <line x1="380" y1="190" x2="820" y2="190" stroke="url(#amber)" stroke-width="2" opacity="0.4"/>

  <!-- Tagline -->
  <text x="380" y="230" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="400" fill="#A1A1AA" letter-spacing="0.5">
    Hear a sound you love?
  </text>
  <text x="380" y="264" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="500" fill="#F59E0B" letter-spacing="0.5">
    Learn to make it.
  </text>

  <!-- URL -->
  <text x="380" y="316" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', monospace" font-size="16" font-weight="400" fill="#71717A" letter-spacing="1">
    soundsauce.app
  </text>

  <!-- Subtle bottom accent line -->
  <rect x="0" y="390" width="1584" height="6" fill="url(#amber)" opacity="0.6"/>
</svg>